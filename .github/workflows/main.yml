name: C# CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HelloWorld.Tests/HelloWorld.Tests.csproj

      - name: Build
        run: dotnet build HelloWorld.Tests/HelloWorld.Tests.csproj --no-restore

      - name: Test
        run: dotnet test HelloWorld.Tests/HelloWorld.Tests.csproj --no-build --no-restore
